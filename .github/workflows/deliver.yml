name: Test and deliver

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testhttp-delivery
  cancel-in-progress: false

jobs:
  deliver:
    if: >-
      github.repository == 'Serega71RUS/testhttp' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, X64, testhttp]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build develop or promote tested image to production
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          INFRA_SSH_KEY: ${{ secrets.INFRA_SSH_KEY }}
          ARGO_READ_TOKEN: ${{ secrets.ARGO_READ_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python3 .github/scripts/deliver.py
